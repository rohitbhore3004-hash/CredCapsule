[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "credcapsule"
version         = "4.0.0"
description     = "AES-256-GCM credential vault with X3DH session bootstrap and Double Ratchet forward secrecy"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
keywords        = ["vault", "credentials", "encryption", "aes-gcm", "x3dh", "double-ratchet"]

dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
credcapsule = "credcapsule_single:_cli_main"

[tool.setuptools]
py-modules = ["credcapsule_single"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["credcapsule_single"]
